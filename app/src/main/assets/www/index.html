<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كحباتي</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .upload-btn {
      background-color: var(--accent-color);
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      position: relative;
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #38bdf8;
      display: none;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ تطبيق كحباتي ✨</h1>
    <p>حفظ أبدي أونلاين بدون ما تروح عليك أي صورة!</p>
  </header>

  <div class="controls">
    <div class="file-input-wrapper">
      <button class="upload-btn">
        <span>📸 رفع صور جديدة للسيرفر</span>
      </button>
      <input type="file" id="imageInput" accept="image/*" multiple>
    </div>
    <div class="status-msg" id="statusMsg">جاري الرفع للسيرفر... انتظر لحظة ⏳</div>
  </div>

  <div class="gallery" id="gallery">
    <div class="empty-msg" id="emptyMsg">بعدك ما ضايف أي صورة.. ارفع صورك هسة!</div>
  </div>

  <script>
    // ⚠️ استبدل هذن القيم بالقيم مالتك من موقع Cloudinary
    const CLOUD_NAME = "YOUR_CLOUD_NAME"; 
    const UPLOAD_PRESET = "YOUR_UPLOAD_PRESET"; 

    const imageInput = document.getElementById('imageInput');
    const gallery = document.getElementById('gallery');
    const emptyMsg = document.getElementById('emptyMsg');
    const statusMsg = document.getElementById('statusMsg');

    // تحميل روابط الصور المحفوظة عند فتح التطبيق
    document.addEventListener('DOMContentLoaded', loadSavedImages);

    imageInput.addEventListener('change', async function (e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      statusMsg.style.display = 'block';

      for (let file of files) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (data.secure_url) {
            saveUrlLocally(data.secure_url);
            renderImage(data.secure_url);
          }
        } catch (err) {
          alert('صار خطأ بالرفع، تأكد من الاتصال بالإنترنت أو إعدادات السيرفر.');
        }
      }

      statusMsg.style.display = 'none';
      imageInput.value = '';
    });

    function saveUrlLocally(url) {
      let urls = JSON.parse(localStorage.getItem('kahbati_urls') || '[]');
      urls.push(url);
      localStorage.setItem('kahbati_urls', JSON.stringify(urls));
    }

    function loadSavedImages() {
      let urls = JSON.parse(localStorage.getItem('kahbati_urls') || '[]');
      if (urls.length > 0) {
        emptyMsg.style.display = 'none';
        urls.forEach(url => renderImage(url));
      }
    }

    function renderImage(src) {
      emptyMsg.style.display = 'none';
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = src;
      card.appendChild(img);
      gallery.appendChild(card);
    }
  </script>
</body>
</html>

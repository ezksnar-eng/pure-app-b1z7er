<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Pure</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
:root{--bg:#0a0a0c;--c:#15171b;--t:#f2f2f4;--m:#8b90a0;--a:#7a8fb3}
body.l{--bg:#f3f4f7;--c:#fff;--t:#16181d;--m:#666b78}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-bottom:84px;user-select:none}
#bn{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid #2a2d35;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
#bn div{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--m)}#bn div span{display:block;font-size:20px}
.top{display:flex;align-items:center;gap:14px;padding:14px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h2{flex:1;font-size:22px}.ic{background:none;border:0;color:var(--t);font-size:24px}
.tabs{display:flex;border-bottom:1px solid #2a2d35;margin:0 12px 12px}
.tabs div{flex:1;text-align:center;padding:12px 0;color:var(--m)}.tabs .on{color:var(--t);border-bottom:3px solid var(--a)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px}
.cd{position:relative}.cd img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:16px;background:var(--c)}
.cd p{margin-top:6px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{position:absolute;top:6px;right:6px;background:var(--a);color:#000;font-size:10px;padding:2px 7px;border-radius:8px}
.m{color:var(--m);padding:14px}.pad{padding:14px}
.bt{background:var(--c);color:var(--t);border:1px solid #2a2d35;border-radius:14px;padding:12px 16px;margin:4px;font-size:15px}
.bt.p{background:var(--a);color:#000;border:0}
input,select{width:100%;background:var(--c);color:var(--t);border:1px solid #2a2d35;border-radius:12px;padding:12px;margin:6px 0;font-size:15px}
.chip{display:inline-block;border:1px solid #3a3e48;border-radius:14px;padding:5px 12px;margin:3px;font-size:13px}
.row{display:flex;gap:12px;align-items:flex-start}.row img{width:40%;border-radius:16px}
.ch{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #22252c}
#dr{position:fixed;top:0;bottom:0;right:0;width:78%;background:var(--bg);transform:translateX(100%);transition:.25s;z-index:20;padding:20px;overflow:auto;box-shadow:0 0 40px #000}
#dr.o{transform:none}#dr div.i{padding:15px 10px;border-radius:14px;margin:4px 0;background:var(--c)}
#dr h3{text-align:center;margin:10px 0 20px}
#pl{display:none;position:fixed;inset:0;background:#000;z-index:30;overflow:auto;color:#fff}
#ts{display:none;position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--a);color:#000;padding:10px 18px;border-radius:20px;z-index:40}
.rd img{width:100%;display:block}
</style></head><body>
<div id="dr"></div><div id="bn"><div onclick="go('all')"><span>🏠</span>الرئيسية</div><div onclick="go('manga')"><span>📖</span>مانجا</div><div onclick="go('anime')"><span>🎬</span>أنمي</div><div onclick="stack=[home];nav(imp)"><span>⬇️</span>استيراد</div><div onclick="menu()"><span>☰</span>المزيد</div></div><div id="app"></div>
<div id="pl"><button class="bt" onclick="$('#pl').style.display='none';$('#pb').innerHTML=''">✕ إغلاق</button><div id="pb"></div></div><div id="ts"></div>
<script>
const P={toString:()=>(DB.proxy||'http://127.0.0.1:8080/')+'?url='},E=encodeURIComponent,$=s=>document.querySelector(s);
const DB=Object.assign({items:[],fav:[],hist:[],views:{},name:'EZ JERRY',light:0},JSON.parse(localStorage.pure||'{}'));
const sv=()=>localStorage.pure=JSON.stringify(DB),px=u=>u?P+E(u):'';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{$('#ts').textContent=m;$('#ts').style.display='block';setTimeout(()=>$('#ts').style.display='none',2500)};
const RX=/https?:\\?\/\\?\/[^"'\s<>]+?\.(?:mp4|m3u8)[^"'\s<>\\]*/g;
let tab='new',sec='all',stack=[],cbs={};
window.__cb=(id,h)=>{cbs[id](h);delete cbs[id]};
document.body.classList.toggle('l',!!DB.light);
/* ===== جلب الصفحات: بروكسي أولاً، وإذا حماية (Cloudflare/روبوت) يستخدم متصفح مخفي ===== */
async function get(u){
 try{const r=await fetch(P+E(u));const t=await r.text();
  if(r.ok&&!/Just a moment|cf-chl|cf-browser-verification|g-recaptcha|hcaptcha/i.test(t.slice(0,8000)))return t}catch(e){}
 if(window.Native)return new Promise((ok,no)=>{const id='c'+Date.now();cbs[id]=ok;Native.fetchHtml(id,u);setTimeout(()=>no('timeout'),45000)});
 throw 'fail'}
const doc=h=>new DOMParser().parseFromString(h,'text/html');
const abs=(u,b)=>{try{return new URL(u,b).href}catch(e){return ''}};
const im=(e,b)=>abs(e.getAttribute('data-src')||e.getAttribute('data-lazy-src')||e.getAttribute('data-original')||(e.getAttribute('srcset')||'').split(' ')[0]||e.getAttribute('src')||'',b);
const og=(d,k)=>(d.querySelector(`meta[property="og:${k}"]`)||{}).content;
/* ===== استخراج ===== */
function cards(d,b){const s={},o=[];
 d.querySelectorAll('a[href]').forEach(a=>{const i=a.querySelector('img');if(!i)return;
  const h=abs(a.getAttribute('href'),b);if(!h||s[h]||h==b||h.includes('#'))return;
  const t=(a.title||i.alt||a.textContent||'').trim().replace(/\s+/g,' ').slice(0,80),c=im(i,b);
  if(!t||!c||c.startsWith('data:'))return;s[h]=1;o.push({title:t,cover:c,url:h})});return o}
async function fetchD(it){
 const d=doc(await get(it.url));
 it.desc=(og(d,'description')||(d.querySelector('.summary__content,.entry-content,[itemprop=description],.description')||{}).textContent||'').trim().slice(0,400);
 it.genres=[...new Set([...d.querySelectorAll('a[href*=genre],a[href*=tag],a[href*=category],a[rel=tag]')].map(a=>a.textContent.trim()).filter(t=>t&&t.length<20))].slice(0,8);
 const s={},ch=[];
 d.querySelectorAll('a[href]').forEach(a=>{const h=abs(a.getAttribute('href'),it.url),t=a.textContent.trim().replace(/\s+/g,' ');
  if(!s[h]&&h!=it.url&&t.length<70&&/chapter|episode|ep-|ep\/|فصل|حلقة|الحلقة|الفصل/i.test(h+' '+t)){s[h]=1;ch.push({t:t||h,u:h})}});
 it.ch=ch;sv()}
async function servers(u){
 const h=await get(u),d=doc(h);let S=[];
 d.querySelectorAll('iframe').forEach(f=>{const s=f.getAttribute('src')||f.getAttribute('data-src');if(s)S.push({n:'iframe',u:abs(s,u)})});
 d.querySelectorAll('video source[src],video[src]').forEach(v=>S.push({n:'direct',u:abs(v.getAttribute('src'),u)}));
 d.querySelectorAll('[data-url],[data-embed],[data-video],option[value]').forEach(e=>{
  let v=e.getAttribute('data-url')||e.getAttribute('data-embed')||e.getAttribute('data-video')||e.value||'';
  if(!/^(https?:)?\/\//.test(v)){try{v=atob(v)}catch(x){}}
  const m=v.match(/src=["']([^"']+)/);if(m)v=m[1];
  if(/^(https?:)?\/\//.test(v))S.push({n:/\.(mp4|m3u8)/.test(v)?'direct':'iframe',u:abs(v,u)})});
 (h.match(RX)||[]).forEach(x=>S.push({n:'direct',u:x.replace(/\\/g,'')}));
 await Promise.all(S.filter(s=>s.n=='iframe').slice(0,6).map(async s=>{try{const t=await fetch(P+E(s.u)).then(r=>r.text());(t.match(RX)||[]).forEach(x=>S.push({n:'direct',u:x.replace(/\\/g,'')}))}catch(e){}}));
 const k={};S=S.filter(s=>s.u&&!k[s.u]&&(k[s.u]=1));return S.sort((a,b)=>(b.n=='direct')-(a.n=='direct'))}
/* ===== واجهات ===== */
function nav(f){stack.push(f);f()}
function back(){if($('#dr').classList.contains('o')){$('#dr').classList.remove('o');return true}
 if($('#pl').style.display=='block'){$('#pl').style.display='none';$('#pb').innerHTML='';return true}
 if(stack.length>1){stack.pop();stack[stack.length-1]();return true}return false}
function head(t){return`<div class=top><button class=ic onclick="menu()">☰</button><h2>${t}</h2><button class=ic onclick="nav(srch)">🔍</button></div>`}
function menu(){$('#dr').innerHTML=`<h3>${esc(DB.name)}</h3>
<div class=i onclick="go('all')">🏠 الرئيسية</div><div class=i onclick="go('manga')">📖 مانجا</div><div class=i onclick="go('anime')">🎬 أنمي</div>
<div class=i onclick="sh(imp)">⬇️ استيراد مانجا / أنمي</div><div class=i onclick="sh(srch)">🔍 بحث</div><div class=i onclick="sh(hist)">🕘 سجل المشاهدة</div>
<div class=i onclick="DB.light=!DB.light;document.body.classList.toggle('l',!!DB.light);sv()">🌓 الوضع الليلي / النهاري</div>
<div class=i onclick="DB.proxy=prompt('عنوان البروكسي',DB.proxy||'http://127.0.0.1:8080/')||DB.proxy;sv()">🛡️ عنوان البروكسي</div>
<div class=i onclick="DB.name=prompt('الاسم',DB.name)||DB.name;sv();menu()">✏️ تغيير الاسم</div>`;$('#dr').classList.add('o')}
function go(s){sec=s;$('#dr').classList.remove('o');stack=[home];home()}
function sh(f){$('#dr').classList.remove('o');nav(f)}
function grid(L){return`<div class=g>${L.map(x=>`<div class=cd onclick="nav(()=>det(${DB.items.indexOf(x)}))"><img loading=lazy src="${px(x.cover)}"><b class=bd>${x.type=='anime'?'أنمي':'مانجا'}</b><p>${esc(x.title)}</p></div>`).join('')||'<p class=m>ما اكو محتوى — روح لـ "استيراد" وحط رابط موقع</p>'}</div>`}
function home(){let L=DB.items.filter(x=>sec=='all'||x.type==sec);
 if(tab=='top')L=[...L].sort((a,b)=>(DB.views[b.url]||0)-(DB.views[a.url]||0));else if(tab=='fav')L=L.filter(x=>DB.fav.includes(x.url));else L=[...L].reverse();
 const T=[['new','⚡ آخر التحديثات'],['top','🔥 الأكثر مشاهدة'],['fav','⭐ المفضلة']];
 $('#app').innerHTML=head({all:'الرئيسية',manga:'المانجا',anime:'الأنمي'}[sec])+`<div class=tabs>${T.map(t=>`<div class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';home()">${t[1]}</div>`).join('')}</div>`+grid(L)}
function srch(){$('#app').innerHTML=head('بحث')+`<div class=pad><input id=q placeholder="ابحث بالاسم..." oninput="$('#sr').innerHTML=grid(DB.items.filter(x=>x.title.toLowerCase().includes(this.value.toLowerCase())))"></div><div id=sr></div>`}
function hist(){$('#app').innerHTML=head('سجل المشاهدة')+grid(DB.hist.map(u=>DB.items.find(x=>x.url==u)).filter(Boolean))}
async function det(i){const it=DB.items[i];DB.views[it.url]=(DB.views[it.url]||0)+1;sv();
 const draw=()=>{$('#app').innerHTML=`<div class=top><button class=ic onclick="back()">→</button><h2></h2></div><div class="pad"><div class=row><img src="${px(it.cover)}"><div><h3>${esc(it.title)}</h3><p class=m>${it.type=='anime'?'أنمي':'مانجا'}${it.ch?' | '+it.ch.length+' '+(it.type=='anime'?'حلقة':'فصل'):''}</p></div></div>
 <div style="margin:12px 0">${(it.genres||[]).map(g=>`<span class=chip>${esc(g)}</span>`).join('')}</div><p>${esc(it.desc)}</p>
 <div style="margin:12px 0"><button class="bt p" onclick="fv(${i})">${DB.fav.includes(it.url)?'★ بالمفضلة':'☆ أضف للمفضلة'}</button><button class=bt onclick="fetchD(DB.items[${i}]).then(()=>det(${i}))">🔄 تحديث</button></div>
 <h3>${it.type=='anime'?'الحلقات':'الفصول'}</h3></div>${it.ch?it.ch.map((c,k)=>`<div class=ch onclick="op(${i},${k})"><span>${esc(c.t)}</span><span>▶</span></div>`).join('')||'<p class=m>ما لقيت فصول</p>':'<p class=m>جاري سحب التفاصيل...</p>'}`};
 draw();if(!it.ch){try{await fetchD(it);draw()}catch(e){toast('فشل سحب التفاصيل')}}}
function fv(i){const u=DB.items[i].url,k=DB.fav.indexOf(u);k<0?DB.fav.push(u):DB.fav.splice(k,1);sv();det(i)}
function op(i,k){const it=DB.items[i];DB.hist=[it.url,...DB.hist.filter(x=>x!=it.url)].slice(0,50);sv();it.type=='anime'?ep(i,k):nav(()=>rdr(i,k))}
async function rdr(i,k){const it=DB.items[i],c=it.ch[k];$('#app').innerHTML=`<div class=top><button class=ic onclick="back()">→</button><h2>${esc(c.t)}</h2></div><p class=m>جاري تحميل الصفحات...</p>`;
 try{const d=doc(await get(c.u));const box=d.querySelector('#readerarea,.reading-content,.chapter-content,#chapter-container,.entry-content')||d.body;
  const L=[...new Set([...box.querySelectorAll('img')].map(x=>im(x,c.u)).filter(x=>x&&!x.startsWith('data:')&&!/logo|avatar|banner|icon|\.gif/i.test(x)))];
  $('#app').innerHTML=`<div class=top><button class=ic onclick="back()">→</button><h2>${esc(c.t)}</h2></div><div class=rd>${L.map(x=>`<img loading=lazy src="${px(x)}">`).join('')||'<p class=m>ما لقيت صور</p>'}</div><div class=pad>${k>0?`<button class=bt onclick="stack.pop();nav(()=>rdr(${i},${k-1}))">الفصل الأحدث ←</button>`:''}${k<it.ch.length-1?`<button class="bt p" onclick="stack.pop();nav(()=>rdr(${i},${k+1}))">→ الفصل الأقدم</button>`:''}</div>`}
 catch(e){$('#app').innerHTML+='<p class=m>فشل التحميل</p>'}}
async function ep(i,k){const c=DB.items[i].ch[k];$('#pl').style.display='block';const b=$('#pb');b.innerHTML='<p class=m>جاري البحث عن السيرفرات...</p>';
 let S=[];try{S=await servers(c.u)}catch(e){}window.SV=S;
 b.innerHTML=`<div class=pad><b>${esc(c.t)}</b></div>`+(S.length?S.map((s,j)=>`<button class=bt onclick="play(${j})">${s.n=='direct'?'مباشر':'سيرفر'} ${j+1}</button>`).join(''):'<p class=m>ما لقيت سيرفرات</p>')+'<div id=pv></div>';if(S.length)play(0)}
function play(j){const s=SV[j],v=$('#pv');
 if(s.n=='iframe')v.innerHTML=`<iframe src="${esc(s.u)}" allowfullscreen style="width:100%;height:56vw;border:0"></iframe>`;
 else{v.innerHTML='<video controls autoplay playsinline style="width:100%"></video>';const e=v.firstChild;
  if(/\.m3u8/.test(s.u)&&window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(s.u);h.attachMedia(e)}else e.src=s.u}}
function imp(){$('#app').innerHTML=head('استيراد')+`<div class=pad><select id=it><option value=manga>مانجا</option><option value=anime>أنمي</option></select>
<input id=iu placeholder="رابط صفحة قائمة الموقع https://..." dir=ltr><input id=ip type=number value=1 min=1 placeholder="عدد الصفحات"><label><input type=checkbox id=if style="width:auto"> سحب التصنيفات والوصف والفصول لكل عنصر (أبطأ)</label>
<button class="bt p" style="width:100%;margin:10px 0" onclick="doImport()">استيراد</button><p id=st class=m></p><p class=m>العناصر المحفوظة: ${DB.items.length}</p></div>`}
async function doImport(){const u=$('#iu').value.trim(),type=$('#it').value,n=+$('#ip').value||1,full=$('#if').checked;
 if(!/^https?:/.test(u))return toast('حط رابط صحيح');let a=0;
 for(let p=1;p<=n;p++){const url=p==1?u:u.replace(/\/$/,'')+'/page/'+p+'/';$('#st').textContent='جاري سحب الصفحة '+p+'...';
  let h;try{h=await get(url)}catch(e){$('#st').textContent='فشل الجلب (تأكد من البروكسي أو حماية الموقع)';return}
  const d=doc(h);let L=cards(d,url);
  if(!L.length&&p==1&&og(d,'title'))L=[{title:og(d,'title'),cover:abs(og(d,'image')||'',url),url}];
  if(!L.length)break;
  L.forEach(x=>{if(!DB.items.some(y=>y.url==x.url)){x.type=type;DB.items.push(x);a++}});sv()}
 if(full)for(const x of DB.items.filter(y=>y.type==type&&!y.ch)){$('#st').textContent='تفاصيل: '+x.title;try{await fetchD(x)}catch(e){}}
 $('#st').textContent='تم استيراد '+a+' عنصر ✅'}
stack=[home];home();
</script></body></html>

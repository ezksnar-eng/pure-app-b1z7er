<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كحباتي</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .upload-btn {
      background-color: var(--accent-color);
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .upload-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      position: relative;
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.25 ease;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 14px;
      font-weight: bold;
    }

    .card:hover .delete-btn {
      opacity: 1;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
      font-size: 1.1rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 35px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ تطبيق كحباتي ✨</h1>
    <p>ارفع شگد ما تريد صور بدون حدود وحفظ تلقائي!</p>
  </header>

  <div class="controls">
    <div class="file-input-wrapper">
      <button class="upload-btn">
        <span>📸 رفع صور جديدة (اختيار متعدد)</span>
      </button>
      <input type="file" id="imageInput" accept="image/*" multiple>
    </div>
  </div>

  <div class="gallery" id="gallery">
    <div class="empty-msg" id="emptyMsg">بعدك ما ضايف أي صورة.. ارفع صورك واشوفك الرهابة!</div>
  </div>

  <div class="modal" id="imageModal">
    <span class="close-modal" id="closeModal">&times;</span>
    <img id="modalImg" src="" alt="عرض الصور">
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const gallery = document.getElementById('gallery');
    const emptyMsg = document.getElementById('emptyMsg');
    const imageModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const closeModal = document.getElementById('closeModal');

    // إعداد قاعدة بيانات IndexedDB لحفظ عدد لا نهائي من الصور
    let db;
    const request = indexedDB.open("KahbatiDB", 1);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains('photos')) {
        db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      loadImagesFromDB();
    };

    imageInput.addEventListener('change', function (e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function (event) {
          const imageData = event.target.result;
          saveImageToDB(imageData);
        };
        reader.readAsDataURL(file);
      });

      imageInput.value = '';
    });

    function saveImageToDB(dataUrl) {
      const tx = db.transaction('photos', 'readwrite');
      const store = tx.objectStore('photos');
      const item = { data: dataUrl, timestamp: Date.now() };
      const req = store.add(item);

      req.onsuccess = function(e) {
        renderImage(dataUrl, e.target.result);
      };
    }

    function loadImagesFromDB() {
      const tx = db.transaction('photos', 'readonly');
      const store = tx.objectStore('photos');
      const req = store.getAll();

      req.onsuccess = function() {
        const items = req.result;
        if (items.length > 0) {
          emptyMsg.style.display = 'none';
          items.forEach(item => renderImage(item.data, item.id));
        }
      };
    }

    function renderImage(src, id) {
      emptyMsg.style.display = 'none';

      const card = document.createElement('div');
      card.className = 'card';

      const img = document.createElement('img');
      img.src = src;
      img.onclick = () => openModal(src);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.innerHTML = '✕';
      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        deleteImageFromDB(id, card);
      };

      card.appendChild(img);
      card.appendChild(deleteBtn);
      gallery.appendChild(card);
    }

    function deleteImageFromDB(id, cardElement) {
      const tx = db.transaction('photos', 'readwrite');
      const store = tx.objectStore('photos');
      store.delete(id);

      tx.oncomplete = function() {
        cardElement.remove();
        if (gallery.querySelectorAll('.card').length === 0) {
          emptyMsg.style.display = 'block';
        }
      };
    }

    function openModal(src) {
      modalImg.src = src;
      imageModal.classList.add('active');
    }

    closeModal.onclick = () => imageModal.classList.remove('active');
    imageModal.onclick = (e) => {
      if (e.target === imageModal) imageModal.classList.remove('active');
    };
  </script>
</body>
</html>
